version: 1
org: Cloudbird-Software
# ============================================================================
# 组织地图（repo registry）—— 一文件看清治理版图
# 目的: 结构层导航（人/AI 不必逐仓打开即知全貌）+ 漂移检测锚点。
#       替代 submodule 方案：无指针过期、无 recursive clone 问题。
# 规则（GM-4）:
#   - 线上存在的仓必须在下方申报；未申报 = drift（drift-check §7b）
#   - status: active 的仓必须存在且 visibility 一致（drift-check §7a）
#   - status: planned = 尚未建仓（不参与检测）；exempt = 申报但不治理（仅豁免治理基线，不豁免可见性）
#   - 全仓公开政策（ADR-0020）：一切仓 visibility 必须 public（drift-check §7a 申报侧 + §7c 线上全量侧，含未申报仓）
#   - 新仓初始化后必须申报入图（flows.new_repo step 4）
# ============================================================================
layers:
  L0: 标准与治理（intent：GOVERNANCE / 标准 schema / 工作流实现）
  L1: 记忆与试卷（ADR 正本+索引 / 运行报告 / 验收场景封存）——ADR-0085：声明层退役
  L2: 实现（代码：框架、工具、业务项目）
  L3: 数据（不进 git：事件流 / 轨迹 / 团队运行态）

repos:
  - name: .github
    layer: L0
    visibility: public
    status: active
    role: 治理总仓——GOVERNANCE/rulesets/expected-state/policies/agent 标准 schema/初始化与漂移脚本
    key_paths: [governance/, standards/agent/, scripts/, specs/]
    entry_protocol: true   # AGENTS.md 携带统一入口协议块（宪法 §11；drift §17 对账，ADR-0055）

  - name: CI-Workflows
    layer: L0
    visibility: public
    status: active
    role: 可复用工作流仓——全部项目仓 gate 的唯一实现，业务仓引用 @v1
    key_paths: [.github/workflows/, pipeline/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: agent-registry
    layer: L1
    visibility: public
    status: retired   # ADR-0085：多 agent 编排声明层退役，GitHub 归档只读；快照=archive/retired/；ADR 家园已迁 archive/adr/
    role: （退役）注册层——声明快照见 archive/retired/agent-registry/；git 历史即正本存档

  - name: archive
    layer: L1
    visibility: public
    status: active
    role: 记忆层——ADR 家园（正本+INDEX 索引同仓，ADR-0085 单仓化）+退役快照 retired/
      +PM 运行报告 runs/（[followup] 周度 digest 消费）+规划回归集+事件 JSONL+红队报告落位
    key_paths: [adr/, runs/, retired/, scripts/verify_migration.py]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: template-service
    layer: L2
    visibility: public
    status: active
    role: 项目模板仓——新仓由此派生，自动继承 gate/护栏/AGENTS.md 骨架；统一入口协议块下发真源（ADR-0055）
    key_paths: [AGENTS.md, .github/workflows/ci.yml, docs/ARCHITECTURE.md]
    entry_protocol: true   # 协议块真源自身（drift §17 以其 main 的块为 canon 比对，ADR-0055）

  - name: agent-tools
    layer: L2
    visibility: public
    status: retired   # ADR-0085：TS 工具服务器随编排框架退役，GitHub 归档只读
    role: （退役）工具实现仓——指针页 archive/retired/agent-tools.md
  - name: agent-platform
    layer: L2
    visibility: public
    status: retired   # ADR-0085：渲染层随编排框架退役，GitHub 归档只读
    role: （退役）执行层仓——指针页 archive/retired/agent-platform.md

  - name: arbiter
    layer: L2
    visibility: public
    status: active
    role: 仲裁内核——确定性裁决/CAS 租约/防重放台账（宪法 §1）；无 LLM、默认拒绝、
      自带测试与误放行台账（ADR-0054）
    key_paths: [arbiter/, capabilities.yaml, tests/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: Shorts_Director
    layer: L2
    visibility: public
    status: active
    role: 产品仓——短视频导演工具（ADR-0021：线上存在但未申报=GM-4 漂移，补申报；治理面
      随首个正式 PR 落地 AGENTS.md/CODEOWNERS 接入）
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: Script_Writer
    layer: L2
    visibility: public
    status: active
    role: 产品仓——剧本创作工具（ADR-0021：建仓未申报=GM-4 漂移，补申报；治理面随首个
      正式 PR 落地 AGENTS.md/CODEOWNERS 接入，路径同 Shorts_Director）
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: Use-up-Plan
    layer: L2
    visibility: public
    status: active
    role: 产品仓——AI 多 plan 额度管理与路由调度工具（额度审计/规则标准化描述/最优
      分配求解/实时切换；立项意图见仓内 Intent.md，ADR-0024 申报入图+bootstrap 直推
      豁免；README 待首个正式 PR 脱离模板文案）
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: AI_Web_School
    layer: L2
    visibility: public
    status: active
    role: 产品仓——小学语数英个性化练习平台（Python/FastAPI 存量栈，语言准入按 ADR-0023
      存量豁免，仅面向新服务选型）；治理面已接入：gate（CI-Workflows@v1 聚合）/automerge/
      scorecard/CODEOWNERS/dependabot + App 挂载（AG-4）+ production environment（RL-1）
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: mutual
    layer: L2
    visibility: public
    status: active
    role: 产品仓——LLM 双向互惠推荐引擎（Go+BAML 重写，ADR-0027；源自 gitcode.com/feasylol/mutual
      存量 Python 项目：11 阶段流水线 / NSW 匹配 + envy-freeness / HR@K/NDCG@5 评测门禁；
      Python 基线为一次性存量导入豁免——仅作重写参照与 golden fixtures 来源，重写合并后
      语言面收敛为 Go+BAML）
    key_paths: [src/mutual/, spec/, tests/golden/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: QW_Arena1
    layer: L2
    visibility: public
    status: active
    role: 产品仓——千问 AI Arena「一键出海：商品素材全自动生成」参赛 Agent（跨境电商 listing
      素材全自动生成，IR .github#345）；Python 语言（languages.yaml 对本仓整体豁免，ADR-0084：
      外部契约优先/比赛沙箱部署/有限生命周期三条件，豁免仅语言规范面、治理基线不豁免）；建仓
      bootstrap 直推豁免空仓变体（ADR-0084）；2026-08-31 赛后按 ADR-0084 退役条款处置
    key_paths: [src/, tests/, quality/, docs/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: Viral_Radar
    layer: L2
    visibility: public
    status: active
    role: 产品仓——全网多平台爆款对标分析与脚本生成系统（微信视频号/抖音/小红书对标账号
      数据采集、多模态文案提取 ASR+OCR、LLM 秒级爆款逻辑拆解、单账号/聚合报告与脚本草稿
      生成；IR Viral_Radar#1）；Python 语言（languages.yaml 对本仓整体豁免，ADR-0091：
      多模态推理链生态复用型豁免——ASR/OCR/LLM 网关三层 Python 生态垄断 + IR 明示
      复用优先，豁免仅语言规范面、治理基线不豁免）；建仓 bootstrap 直推 (b) 类豁免
      登记（ADR-0092）；README 待首个正式 PR 脱离模板文案
    key_paths: [src/, tests/, quality/, docs/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: Media-Monitor
    layer: L2
    visibility: public
    status: active
    role: 产品仓——多平台媒体与受众监控工具（合同驱动的采集引擎：关键词搜索/评论/
      用户资料含 uid+sec_uid 与地区标签、直播间行为事件流、群成员枚举、ADB 手机
      自动化与 GUI 视觉模型层、MCP/CLI 接口；go 语言（默认准入，languages.yaml
      go default）；治理面随 bootstrap PR 一次落地：gate（CI-Workflows@v1 聚合）/
      AGENTS.md 入口协议块/CODEOWNERS/dependabot；登记依据 flows.new_repo step 4，
      引用 ADR-0024 申报+bootstrap 先例与 ADR-0092；bootstrap 走 PR 路径）
    key_paths: [cmd/, internal/, adapt/, docs/, .github/workflows/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: holdout
    layer: L1
    visibility: public
    status: active
    role: 试卷层——封存验收场景+golden+泄漏诱饵（宪法 §1/§4B，IR-0003 W1-C4 .github#167，
      ADR-0056/ADR-0080）；owner 直管；cloudbrid-agent 严禁挂载，验证者 APP 可挂载并
      仅用于测试/验证路径写权（DECISION-02 隔离不变量，drift-check §18 断言）
    key_paths: [entries/, schema/, canary/]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）

  - name: cnb-bridge
    layer: L2
    visibility: public
    status: active
    role: CNB 免费算力桥接仓（可删除层，EX-1/ADR-0085/IR-0004 D 组）——多账号池
      accounts.yaml（无明文 token）+派单协议 cnb_pool.py+work-inbox PM 自起协议+
      REMOVAL.md 单页删除清单；判定永不外置（INV-02）
    key_paths: [accounts.yaml, cnb_pool.py, work-inbox.yaml, REMOVAL.md]
    entry_protocol: true   # ADR-0095：协议块 v2 全仓下发（drift §17 逐字节对账）


# 上游依赖（ADR-0085：openjiuwen 双上游随编排框架退役停止消费；未来引入新上游时
# 恢复本节声明——部署渲染 pin tag 的治理方式不变）
external_upstreams: []
