version: 1
# 状态机转移表（IR-0001 IFACE-03 / ADR-0049）——conductor 唯一定义源，
# 只解释不内嵌逻辑。本文件是 C1 资产：改动走 PR+ADR。
#
# schema：
#   from_state  = 转移前状态（当前 issue 无 state:* 标签时视为 ir-draft）
#   event       = label:state:<name> | comment:/start | comment:/claim | comment:/retry
#                 | label:<非state判定标签>（W3-C1 Bug 流扩展：label:bug/label:reproduced
#                 ——判定标签驱动的转移，见 B1/B2 注）
#   to_state    = 转移后状态（conductor 以 App 身份换标签：移除 from、置上 to）
#   action      = claim | noop（W0 全集；invoke:spec-author 已随 ADR-0085 退役——产出方式不再由状态机指定）
#   guard       = 布尔表达式；变量白名单：sender_role（owner|agent|none）、
#                 author_association（OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR|NONE）、
#                 label_set（当前标签名集合）
# 未列出的 (from_state, event) 组合 = 禁止转移（conductor no-op；重复投递/
# 跳态/反向天然被 from_state 匹配拒绝——幂等键 {issue, from, to} 的落盘形态）。
# W3-C1（ADR-0064）：append bug 流状态 bug/reproduced/fixed 与转移 B1-B5。
# Bug 流与 Feature 流的差异：入口免签（bug 标签即 reproduce 阶段）、
# 判定标签（reproduced/cannot-reproduce/inconclusive）是事实标签而非状态——
# cannot-reproduce 不产生状态转移（保留人裁，ADR-0064 决策 4）；
# bugflow 的状态写序=先移旧态再置新态（防双 state 并存窗口触发
# conductor 多状态 abort）。
states: [ir-draft, ir-signed, spec, redteam, wave-planned, ready, in-progress, quarantine, needs-human, done, bug, reproduced, fixed]

transitions:
  - id: T1  # 主通路：owner/agent 打签署标签 → 进 spec 阶段（BEH-01）。
    # from_state=ir-signed：label 事件送达时签署标签已生效（当前态即 ir-signed）——
    # 首版误写 ir-draft 导致必然 no-op（#143 实测 AUDIT: from=ir-signed verdict=noop）。
    # 守卫不过=回退该标签（退回 ir-draft）；幂等：已在 spec 态则无匹配=no-op。
    # ADR-0085：action 降级 noop——spec 产出方式不再由状态机指定（PM 自著与
    # spec-author 流水线制度等价，PR338 先例；流水线保留为可选快速通道）。
    from_state: ir-signed
    event: label:state:ir-signed
    to_state: spec
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:intent' in label_set"
  - id: T2  # owner 评论 /start 等价签署（AC-1 的 comment 路径；ADR-0085 同 T1 降级 noop）
    from_state: ir-draft
    event: comment:/start
    to_state: spec
    action: noop
    guard: "sender_role == 'owner' and 'type:intent' in label_set"
  - id: T3  # 认领：先到先得（当前态必须 ready，否则 no-op）（BEH-08）
    from_state: ready
    event: comment:/claim
    to_state: in-progress
    action: claim
    guard: "sender_role == 'agent' or author_association in ['OWNER', 'MEMBER', 'COLLABORATOR']"
  - id: T4  # 隔离重判（BEH-07 的 /retry 回流）
    from_state: quarantine
    event: comment:/retry
    to_state: ready
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  # T5/T6 suite 就绪谓词（ISSUE-263 AC-12 / W4-C1 .github#282）：
  # suite 就绪 = 确定性谓词，conductor 在转移前重新断言（不信任 dispatch 载荷）：
  #   1. suite/ 目录存在；
  #   2. suite/ 含至少一个非空测试文件（字节数 >0 且含有效断言语法）；
  #   3. 测试文件可解析（python -m py_compile / node --check / 等语言原生语法校验通过）。
  # 任一不满足 → 转移拒绝并告警（fail-closed：不放行不确定的红队/波次规划）。
  # 该谓词由 conductor 在运行时对目标 spec 仓做确定性检查，非仅标签面断言。
  - id: T5  # spec PR 合并 + suite 就绪后进入红队阶段（ISSUE-263 AC-12 / ADR-0049 / W4-C1）
    from_state: spec
    event: label:state:redteam
    to_state: redteam
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:intent' in label_set"
    suite_ready_required: true  # conductor 在转移前执行 suite 就绪谓词（存在+非空+可解析）
  # T6 三元组校验（ISSUE-263 AC-12 / W4-C1 .github#282）：
  # 进入 wave-planned 必须存在该卡本次生命周期内、卡 ID + specVersion + 审计 run ID
  # 三元组对应的 survived 审计记录。禁止跨卡/历史记录短路：
  #   - 卡 ID 必须与当前 issue 匹配；
  #   - specVersion 必须与当前 spec PR 合并后的 spec 版本一致；
  #   - 审计 run ID 必须来自本次生命周期（非历史 run）。
  # 三元组任一缺失或不匹配 → 转移拒绝并告警。
  - id: T6  # redteam 产出 survived 审计记录后进入波次规划（ISSUE-263 AC-12 / ADR-0079 / W4-C1）
    from_state: redteam
    event: label:state:wave-planned
    to_state: wave-planned
    action: noop
    # guard 补洞（ADR-0085，IR-0006 W1 实走发现 2026-08-29）：原 sender_role=='agent'
    # 意图=机器驱动，但 agent 自动触发面自 W4-C1 上线即未接线（workflow_run 未注册
    # 触发、repository_dispatch 无法定位 issue、标签路径无 dispatch 载荷）——T6 对
    # 全部注册事件不可达，PLAYBOOK §3"打 adversary:survived 标签→T6"的 PM 主路径
    # 被 owner 身份拒绝。对齐 T1/T5/T7-T9 的 owner∪agent；证据闸门不变：三元组
    # （卡 ID+specVersion+审计 run ID）仍由 conductor 机械校验，fail-closed。
    guard: "sender_role in ['owner', 'agent'] and 'adversary:survived' in label_set"
    triple_check:  # conductor 在转移前校验三元组 survived 记录
      card_id: issue   # 卡 ID 键 = 当前 issue number
      spec_version: spec  # specVersion 键 = spec 文件版本（SHA 或 semver）
      audit_run_id: adversary-run  # 审计 run ID 键 = adversary 报告 run_id
      source_label: "adversary:survived"  # 触发本转移的 survived 标签
  # needs-human 不可直跳 wave-planned（ISSUE-263 AC-12 / AC-14 / W4-C1）：
  # needs-human → wave-planned 转移不在本表列 = 禁止（conductor no-op）。
  # 该断言作为 required check 在 CI 常驻强制运行（conductor-negtest 模式），
  # 确保没有任何路径可从 needs-human 直跳 wave-planned。
  # ---------- PM 优先范式收口（ADR-0085：T7/T8/T9——卡生命周期补洞 + IR 验收门）----------
  - id: T7  # 卡就绪：波次卡进入可认领态（ADR-0085 决策 5；此前 wave-planned→ready
    # 无转移=conductor 永不执行，卡就绪靠手动标签——收口为机器路径）
    from_state: wave-planned
    event: label:state:ready
    to_state: ready
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:card' in label_set"
  - id: T8  # 卡完成：谓词=存在绑定本卡且已合并的 PR（body 含 Card: 行）——
    # "完成工作卡+测试通过"的机械定义（gate 绿由 PR required checks 承担，
    # 本谓词只认合并事实，ADR-0085 决策 5）
    from_state: in-progress
    event: label:state:done
    to_state: done
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:card' in label_set"
    merged_pr_required: true   # conductor 运行时重查（不信任标签事件载荷）
  - id: T9  # IR 全面验收（Gate 4）：谓词=①全部子卡 state:done ②验收报告
    # specs/<IR>/acceptance.md 存在于本仓——两条件 conductor 运行时重查；
    # 子卡=body 含"父意图: #<本 IR>"的 open issue（ADR-0085 决策 5）
    from_state: wave-planned
    event: label:state:done
    to_state: done
    action: noop
    guard: "sender_role in ['owner', 'agent'] and 'type:intent' in label_set"
    acceptance_required: true  # conductor 运行时重查（全子卡 done + 验收报告存在）
  # ---------- Bug 流（W3-C1 .github#218 / ADR-0064，宪法 §3）----------
  # 执行者：CI-Workflows pipeline/bugflow（bug-reproduce.yml 以 App 身份写标签）。
  # conductor 对 label:bug/label:reproduced 等非 state 标签事件静默 no-op——
  # B1/B2 是状态机声明（唯一转移定义源原则：bug 流的合法转移也必须落表），
  # 由 bugflow 执行转移本体；B5 的人工/流水线双路径均满足 from_state 幂等。
  - id: B1  # Bug 流入口（免签——区别于 Feature 流签署前置）：bug form 落 bug
    # 标签 → 进 reproduce 阶段（state:bug）。无 state 标签按约定视为 ir-draft。
    from_state: ir-draft
    event: label:bug
    to_state: bug
    action: noop
    guard: "'bug' in label_set"
  - id: B2  # 三值判定之【复现】：base 稳定 fail（+fix 候选 pass）→ reproduced
    # 标签 + state:reproduced；reproduced 后产 failing repro test 待 owner 签
    # （锁定 ADR-0061 → 修复 → 关卡 → 合并）。证伪（label:cannot-reproduce）
    # 不在此列：不转移状态、不关单——保留人裁。
    from_state: bug
    event: label:reproduced
    to_state: reproduced
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B3  # 修复合入：owner/agent 置 state:fixed（fix PR 的合并事实回写 bug 单）
    from_state: reproduced
    event: label:state:fixed
    to_state: fixed
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B4  # 终态关单：fixed → done（owner/agent 置 state:done 后关单）
    from_state: fixed
    event: label:state:done
    to_state: done
    action: noop
    guard: "sender_role in ['owner', 'agent']"
  - id: B5  # 三值判定之【不可判定】兜底：环境错/超时/翻转，换新环境重试一次仍
    # 不可判定 → label:inconclusive + state:needs-human（转人裁）
    from_state: bug
    event: label:state:needs-human
    to_state: needs-human
    action: noop
    guard: "sender_role in ['owner', 'agent']"
