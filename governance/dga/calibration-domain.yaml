version: 1
org: Cloudbird-Software
title: 校准域三快照 schema
description: |
  DGA-human-v1.1 §2.2 扩展二：校准域实体。
  能力组合 / 规格版本 / 本体版本三快照。
calibration_domain:
  capability_profile:
    definition: "当前可用能力组合（工具/模型/环境）"
    required_fields: [tools, models, environments]
    snapshot_fields: [name, version, hash]
    carriers:
      - repo: CI-Workflows
        path: .github/workflows/*.yml
      - repo: env-defs
        path: environments/*.yaml
  specification_version:
    definition: "规格版本快照"
    required_fields: [ir_version, contract_version, policy_version]
    snapshot_fields: [id, semver, sha256]
    carriers:
      - repo: .github
        path: specs/IR-*/spec.md
      - repo: .github
        path: governance/policy/*.yaml
  ontology_version:
    definition: "本体版本快照"
    required_fields: [schema_version, taxonomy_version, mapping_version]
    snapshot_fields: [id, semver, sha256]
    carriers:
      - repo: .github
        path: governance/dga/*.yaml
      - repo: dga-theory
        path: DGA-*.md
