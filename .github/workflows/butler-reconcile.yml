name: butler-reconcile
# 管家主收敛循环——唤醒矩阵行 1（宪法 §11；ADR-0057，W1-C5 .github#168）
# 每 6h 遍历 REPOS.yaml active 仓：僵尸卡（state:in-progress 停滞）/ 孤儿标签
# （closed 仍挂 state:*）/ 隔离超时（state:quarantine 滞留）→ needs-human issue +
# reconcile 报告 issue（label 去重、同日防灌水）。铁律（宪法 §11）：管家永远不
# "自己醒来"——本 workflow 只有 cron 与手动 dispatch 两个触发器，每次运行产出
# AUDIT 审计行（INV-12，governance/butler-audit.sh）。脚本细节见
# governance/butler-reconcile.sh 头注；阈值真源 governance/policy/butler.yaml。
on:
  schedule:
    - cron: "17 */6 * * *" # 每 6h :17（宪法 §11 行 1；错峰避开整点 governance-drift、:18 auto-fix-limit、:23 cost-check）
  workflow_dispatch:
    # 注入入口（AC-2 演习用；空=butler.yaml 真源，不留常开旁路——同 governance-drift P1-4 模式）
    inputs:
      stale_days_override:
        description: "in-progress stale 阈值覆盖（天；0=全部立即 stale——演习制造检出；空=butler.yaml 真源）"
        required: false
        default: ""
      dry_run:
        description: "1=只报告不写（预检）"
        required: false
        default: ""

permissions: {}

# 串行化：开 issue 的"查重→写"非原子，并发运行会重复开 issue（同 governance-drift 设计）
concurrency:
  group: butler-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # 读 governance/ 脚本与 policy
      issues: write    # needs-human/报告 issue 开在 .github 仓（GITHUB_TOKEN 最小权限：
                       # 跨仓读走 GOVERNANCE_TOKEN，本仓写不占用 org 治理令牌）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 一致性扫描（exit 1=有发现已开 needs-human 2=基础设施故障）
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}        # 跨仓读（缺失=脚本 fail-closed 变红）
          GH_WRITE_TOKEN: ${{ github.token }}              # 本仓 issue 写（最小权限分离）
          BUTLER_TRIGGER: ${{ github.event_name }}
          STALE_DAYS_OVERRIDE: ${{ inputs.stale_days_override }}
          BUTLER_DRY_RUN: ${{ inputs.dry_run }}
        run: bash governance/butler-reconcile.sh
      - name: 影子账本落盘（butler-ledger 分支，IR-0006 W1-B2 / BEH-03）
        # butler 源影子持久化：本地 shadow-evidence.jsonl relink 续接 butler-ledger
        # 基链（双侧验链，防覆盖掩盖篡改）后写回。always()：扫描有发现（exit 1）
        # 时审计事件同样必须落账（append-only 纪律优先于本轮结论）。
        if: ${{ always() }}
        env:
          BUTLER_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
        run: |
          set -euo pipefail
          SHADOW="governance/butler/shadow-evidence.jsonl"
          if [[ ! -s "$SHADOW" ]]; then
            echo "OK 本轮无影子记录（audit_emit 未触发或 dry-run）——跳过（幂等）"
            exit 0
          fi
          git config --global user.name butler-ledger-bot && git config --global user.email butler-bot@users.noreply.github.com
          if ! git clone --depth 1 "https://x-access-token:${BUTLER_TOKEN}@github.com/Cloudbird-Software/.github.git" ledger -b butler-ledger 2>/dev/null; then
            git clone --depth 1 "https://x-access-token:${BUTLER_TOKEN}@github.com/Cloudbird-Software/.github.git" ledger
            git -C ledger checkout -b butler-ledger
          fi
          BASE="ledger/$SHADOW"
          # #471 关联根因：但书账本首建时 butler-ledger 分支不存在→克隆默认分支，
          # 而 main 上 governance/butler/ 被 gitignore（影子真源在 *-ledger 分支）——
          # 目录缺位使 : > "$BASE" 崩、butler 源永远 0 条。先建目录再触基链。
          mkdir -p "$(dirname "$BASE")"
          [[ -f "$BASE" ]] || : > "$BASE"
          python3 governance/evidence_shadow.py relink --base "$BASE" --local "$SHADOW" --out merged.jsonl
          python3 governance/evidence_shadow.py verify --file merged.jsonl
          mkdir -p "ledger/governance/butler"
          cp merged.jsonl "$BASE"
          # -f 必带（#475/#476）：governance/butler/shadow-evidence.jsonl 被 .gitignore
          # 忽略（影子真源在 *-ledger 分支，工作树副本不入库）——无 -f 时 git add
          # 被 ignore 拦截 exit 1，push 不执行，butler-ledger 分支永远建不出来
          # （butler 源恒 0）。同类先例：feishu-drill/env-drift/feedback-edge 均 -f。
          git -C ledger add -f "$SHADOW"
          git -C ledger diff --cached --quiet && { echo "OK 影子无新增——不提交（幂等）"; exit 0; }
          git -C ledger commit -m "butler: 影子账本追加（IR-0006 W1-B2 双写，链验通过）"
          for i in 1 2 3; do git -C ledger push "https://x-access-token:${BUTLER_TOKEN}@github.com/Cloudbird-Software/.github.git" HEAD:refs/heads/butler-ledger && break
            git -C ledger pull --rebase "https://x-access-token:${BUTLER_TOKEN}@github.com/Cloudbird-Software/.github.git" butler-ledger || true; sleep 5; done
