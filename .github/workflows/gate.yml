name: gate
on:
  pull_request:
    # edited（qodo review #1，CI-Workflows #8 同款加固）：adr-required 消费
    # 可变的 PR title/body——不订阅 edited 则作者可在 check 通过后编辑掉
    # ADR 引用而不触发重验；补引用救活 fail 的 check 同样依赖 edited 重触发
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # testing.yaml T-01 "gate<5min" 原则的硬上限（红队 #18 P2：无 timeout 的 job 失控可挂 6h）
    permissions:
      contents: read        # job 级最小权限（评审项：防后续新增 job 继承 workflow 级权限）
      pull-requests: read   # 仅 adr-required 步骤读取 PR 文件清单
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: YAML 全量解析（governance + standards）
        run: |
          pip install pyyaml==6.0.3 -q   # 版本钉死（scorecard PinnedDependencies；ADR-0011 版本钉死遗留项）
          python3 - <<'EOF'
          import glob, sys, yaml
          files = glob.glob("governance/**/*.yaml", recursive=True) + glob.glob("standards/**/*.yaml", recursive=True)
          assert files, "未找到任何 yaml"
          for f in files:
              yaml.safe_load(open(f, encoding="utf-8")); print("OK", f)
          EOF
      # JSON 全量校验（红队 #17-B）：expected-state.json 与 rulesets 同为 drift-check/apply 的
      # 期望状态真源——此前 gate 只验 rulesets/*.json，expected-state.json 畸形可静默合入
      # python3 校验替代 apt 装 jq：2026-08-19 两次 main gate 因 apt-get update 挂起烧穿
      # timeout-minutes: 10 整体 cancelled（run 32217218076/32217301896）；python 已就绪、
      # 零外部依赖，消除该故障面。adr-required 用的 jq 系 runner 镜像预装（CI-Workflows
      # ci.yml 从不安装 jq 且连跑绿，实证预装），无需 apt。
      - name: JSON 校验（rulesets + expected-state）
        run: |
          python3 - <<'EOF'
          import glob, json
          files = sorted(glob.glob("governance/rulesets/*.json")) + ["governance/expected-state.json"]
          assert len(files) > 1, "未找到 JSON 文件"
          for f in files:
              json.load(open(f, encoding="utf-8")); print("OK", f)
          EOF
      - name: 脚本语法检查
        run: |
          bash -n governance/apply.sh && bash -n governance/drift-check.sh && bash -n scripts/new-repo-init.sh && bash -n scripts/gh-app-token.sh
          echo "OK scripts"
      - name: REPOS.yaml 引用自检（无重名仓）
        run: |
          python3 - <<'EOF'
          import yaml
          m = yaml.safe_load(open('governance/REPOS.yaml', encoding='utf-8'))
          names = [r['name'] for r in m['repos']]
          assert len(names) == len(set(names)), 'REPOS.yaml 有重名仓'
          print('OK REPOS.yaml', len(names), 'repos')
          EOF
      # adr-required（红队 #17-B/D、#18-P0 部分；对齐 agent-registry ADR-0013 同名 check）：
      # C1 路径（governance/ standards/ scripts/ .github/ CODEOWNERS）变更的 PR，
      # title/body 必须引用 ADR-NNNN——GOVERNANCE flows.governance_change "无 ADR 不合并"
      # 的机器执行。本仓不落盘 ADR（L1 决策记录在 agent-registry/decisions/，
      # 见 REPOS.yaml role）。被引 ADR 的**存在性**校验不在本步骤做：agent-registry 是
      # 私有仓，PR 上下文的 GITHUB_TOKEN 无跨仓读权，而把 org secret（如
      # GOVERNANCE_TOKEN）注入 PR 触发的 workflow = 向 PR 控制的代码暴露凭据
      # （zizmor secret-exposure 模型）——存在性由 drift-check.sh §10 后验（每日，
      # 可信 main 上下文），owner-only review 仍是 C1 的权威人类门禁。
      - name: adr-required（C1 变更须引用 ADR）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 文件清单三防线（qodo review #2 #3 + 追加：换行文件名绕过）：
          # 分页拉全量；rename 的 previous_filename 一并纳入 C1 判定（C1 资产改名
          # 移出受管路径同样是 C1 变更）；files API 3000 文件硬上限 fail-closed。
          # 计数与 C1 匹配全部在 jq 内按 JSON 对象处理——Git 允许文件名含换行，
          # 行流（grep -c / echo|grep）会被单文件多行虚增计数绕过截断检测
          # （qodo review：Newline filenames bypass truncation，AR#22 同款）。
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0
          C1_HIT=0
          PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            if ! jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1; then
              echo "::error::files API 第 $PAGE 页拉取失败——C1 判定完整性无法保证，fail-closed"
              exit 1
            fi
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)]
                     | any(test("^(governance/|standards/|scripts/|\\.github/|CODEOWNERS|profile/)"))'                <<<"$PAGEJSON" >/dev/null 2>&1; then
              C1_HIT=1
            fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then
            echo "::error::PR 声明变更 $CHANGED 个文件但 files API 只返回 $GOT 个（3000 上限截断）——C1 判定完整性无法保证，fail-closed"
            exit 1
          fi
          if [ "$C1_HIT" -ne 1 ]; then
            echo "非 C1 路径变更，跳过 adr-required"
            exit 0
          fi
          # 词边界（评审项）：NOTADR-0013junk 之类子串不得满足 ADR 引用要求
          ADR_RE='\bADR-[0-9]{4}\b'
          if { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then
            echo "OK adr-required: $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u | tr '\n' ' ')（存在性后验：drift-check §10）"
          else
            echo "::error::C1 路径变更（governance/standards/scripts/.github/CODEOWNERS）但 PR 未引用任何 ADR-NNNN（GOVERNANCE flows.governance_change C1：无 ADR 不合并）"
            exit 1
          fi
