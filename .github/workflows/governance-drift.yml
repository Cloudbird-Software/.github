name: governance-drift
on:
  schedule:
    - cron: "0 3 * * *" # 每日 03:00 UTC（红队 #18 P0-1：周检盲区最长 7 天 → 每日；轻量只读检测，成本可忽略）
  workflow_dispatch:

permissions: {}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: 检测治理漂移
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::缺 org secret GOVERNANCE_TOKEN（需 org admin token）。设置: 组织 Settings → Secrets and variables → Actions → New organization secret" >&2
            exit 2
          fi
          bash governance/drift-check.sh | tee drift-report.txt
      - name: 发现漂移则开 issue（幂等）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="治理漂移检测：组织配置与 governance/ 落盘不一致"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title 治理漂移" --json number --jq 'length')
          BODY="自动化检测发现以下漂移（运行 #${{ github.run_id }}）：

          $(cat drift-report.txt)

          修复方式：本地跑 \`bash governance/apply.sh\`，或手动改回后跑 \`bash governance/drift-check.sh\` 验证。

          @randypanding"
          if [[ "$EXISTING" != "0" ]]; then
            NUM=$(gh issue list --repo "$REPO" --state open --search "in:title 治理漂移" --json number --jq '.[0].number')
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
      # 漂移消除自动关闭（红队 #17-G：漂移修复后 open issue 永不关闭=噪音累积，
      # 真漂移会被淹没在陈旧报告里）。检测全绿即判定漂移已消除。
      - name: 漂移消除则关闭 issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          NUMS=$(gh issue list --repo "$REPO" --state open --search "in:title 治理漂移" --json number --jq '.[].number')
          if [[ -z "$NUMS" ]]; then
            echo "无 open 漂移 issue"; exit 0
          fi
          for NUM in $NUMS; do
            gh issue comment "$NUM" --repo "$REPO" --body "漂移已消除（运行 #${{ github.run_id }} 全绿）。自动关闭；如复现将重新开启新报告。"
            gh issue close "$NUM" --repo "$REPO" --reason completed
            echo "closed #$NUM"
          done
