name: governance-drift
on:
  schedule:
    - cron: "0 * * * *" # 每小时整点（ADR-0020：可见性漂移盲区 24h→1h——全仓公开政策的小时级执法；红队 #18 P0-1 周检→每日的延续推进；公开仓 Actions 免费，轻量只读检测成本可忽略）
  workflow_dispatch:
    # P1-4（ADR-0034）：liveness 阈值注入入口——负向注入测试用；缺省走
    # expected-state.json 的 pr_liveness_hours（真源），不留常开旁路
    inputs:
      liveness_hours:
        description: "PR liveness 阈值覆盖（小时；空=用 expected-state pr_liveness_hours）"
        required: false
        default: ""

permissions: {}

# 串行化（coderabbit review：评论去重的"查指纹→写评论"非原子——两个并发运行
# 可能都未发现指纹而各自评论；workflow 级 concurrency 使同一时刻至多一个检测
# 运行，后发的排队等前者落评论后再查指纹，构成原子保护）
concurrency:
  group: governance-drift
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检测治理漂移
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
          PR_LIVENESS_HOURS: ${{ inputs.liveness_hours }}
        run: |
          # pipefail（ADR-0032，P1-3）：Actions 默认 shell（bash -e 无 pipefail）下
          # `drift-check | tee` 的退出码被 tee 吞掉——漂移检出时本步骤仍 success，
          # 下方 if: failure() 的开 issue 分支从不触发（run 32331351942 实证）。
          # GM-1 报警机制依赖本步骤真实变红。
          set -o pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::缺 org secret GOVERNANCE_TOKEN（需 org admin token）。设置: 组织 Settings → Secrets and variables → Actions → New organization secret" >&2
            exit 2
          fi
          bash governance/drift-check.sh | tee drift-report.txt
      - name: 发现漂移则开 issue（幂等；基础设施故障分通道——ADR-0021）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 分通道（红队 #66-G1）：exit 2（token 缺失）与 API 故障不是漂移——
          # 此前一律按漂移开口径开 issue，限流/传输故障会在整点被误报为漂移。
          # 判据：报告里存在 DRIFT 行=真漂移；否则=检测器自身故障（标题/处置路径不同）。
          if ! grep -q '^DRIFT' drift-report.txt 2>/dev/null; then
            TITLE="drift-check 运行失败（基础设施故障——非漂移）"
          else
            TITLE="治理漂移检测：组织配置与 governance/ 落盘不一致"
          fi
          # 归属标记（评审项）：issue 归属判定用专属 label 而非标题搜索——
          # 标题搜索会把人工/其他来源的同名 issue 误当作本检测器的报告去评论/关闭
          LABEL="auto-drift-report"
          gh label create "$LABEL" --repo "$REPO" --description "governance-drift 工作流自动报告（勿手工使用）" --color d73a4a >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --repo "$REPO" --state open --label "$LABEL" --json number --jq 'length')
          # 评论去重（红队 RB-B2，ADR-0016 决策 7）：漂移指纹=稳定漂移集合的 sha256。
          # 同一指纹只报一次——未变化的漂移不每日重复评论（防 issue 评论无限膨胀：
          # 破玻璃未回填等长期漂移此前每日+1 评论）；漂移集变化=新指纹=新评论。
          # 指纹稳定性（评审项：全量报告含每次运行都变的字段——§8 回填时限秒数随
          # 时间增长、OK 行的检测窗口/commit 数随日期漂移，同一漂移会天天得到新
          # 指纹使去重失效）：只取 DRIFT 行、归一化时长秒数（回填时限=NNNs→<AGE>s）、
          # 排序去重后哈希——语义集合不变则指纹跨日恒定，漂移新增/消除/内容实质
          # 变化才产生新指纹。
          # §13 liveness 行含逐秒增长的年龄字段（updated NNNNs 前 / 已 NNNNs / 创建 NNNNs），
          # 不归一化则同一卡死/活体缺失每小时产生新指纹、去重失效（RB-B2 同款）
          FP=$(grep '^DRIFT' drift-report.txt | sed -E 's/回填时限=[0-9]+s/回填时限=<AGE>s/g; s/updated [0-9]+s 前/updated <AGE>s 前/g; s/已 [0-9]+s/已 <AGE>s/g; s/创建 [0-9]+s/创建 <AGE>s/g' | sort -u | sha256sum | cut -d' ' -f1)
          BODY="自动化检测发现以下漂移（运行 #${{ github.run_id }}）：

          $(cat drift-report.txt)

          修复方式：本地跑 \`bash governance/apply.sh\`，或手动改回后跑 \`bash governance/drift-check.sh\` 验证。

          @randypanding

          <!-- drift-fingerprint: $FP -->"
          if [[ "$EXISTING" != "0" ]]; then
            NUM=$(gh issue list --repo "$REPO" --state open --label "$LABEL" --json number --jq '.[0].number')
            # 全量评论比对（coderabbit review：只看最近 10 条时，同一指纹若在
            # 更早的自动评论里会被重复发布——长期未回填漂移的旧报告就是这种形态）
            COMMENTS=$(gh issue view "$NUM" --repo "$REPO" --json comments --jq '[.comments[].body] | join("\n---\n")')
            if grep -qF "drift-fingerprint: $FP" <<<"$COMMENTS"; then
              echo "漂移指纹 $FP 已在 #$NUM 报告过且内容未变化，跳过重复评论（RB-B2 去重）"
            else
              gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            fi
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label "$LABEL"
          fi
      # 漂移消除自动关闭（红队 #17-G：漂移修复后 open issue 永不关闭=噪音累积，
      # 真漂移会被淹没在陈旧报告里）。检测全绿即判定漂移已消除。
      # 只关本检测器自己的报告（--label auto-drift-report，评审项）——
      # 人工开的其他漂移类 issue 不在自动关闭范围，须人工确认后关闭。
      - name: 漂移消除则关闭 issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          NUMS=$(gh issue list --repo "$REPO" --state open --label "auto-drift-report" --json number --jq '.[].number')
          if [[ -z "$NUMS" ]]; then
            echo "无本检测器的 open 漂移 issue"; exit 0
          fi
          for NUM in $NUMS; do
            gh issue comment "$NUM" --repo "$REPO" --body "漂移已消除（运行 #${{ github.run_id }} 全绿）。自动关闭；如复现将重新开启新报告。"
            gh issue close "$NUM" --repo "$REPO" --reason completed
            echo "closed #$NUM"
          done