# core.yaml — DGA-INFRA 本体 Object 层基础实体（M0 定稿）
# 依据：human v1.1 §5.3 六元组↔五层映射（Intent/Context/Evidence→Object）、§5.2 Object 层要件
#       （稳定标识规则、属性集与类型约束、生命周期状态机）；
#       DGA-INFRA 第 1 章权威源表、R-GOV-04/05、R-EVID、R-POOL-CALIB。
id: https://example.org/dga-infra/ontology/core
name: dga-core
title: DGA-INFRA Object 层基础实体
description: >
  闭环六元组各分量的实体载体（Intent/Context/Capability/Evidence）、校准域、
  承诺、授权、S5 决策卡片、具名责任人、项目与服务登记。
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  dga: https://example.org/dga-infra/ontology/
default_prefix: dga
default_range: string
imports:
  - linkml:types
  - enums
  - base

classes:

  Person:
    class_uri: dga:Person
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^PSN-[0-9]{4,}$"
    attributes:
      full_name:
        range: string
        required: true
        description: 具名责任人的真实姓名（责任守恒律：责任只能在具名的人之间转移）。
      org_role:
        range: string
        description: 组织内职能（如 S5 所有者、规格所有者、裁决者——human v1.1 §3.4 人的岗位收敛形态）。
      contact_channel:
        range: string
        description: 可达渠道（升级路径的终点，human v1.1 §3.4 汇报关系拆解为证据流+升级路径）。
    description: >
      具名的人（责任承载者）。责任守恒律（human v1.1 §1.4）：自动化搬运工作量但不搬运
      责任；责任只能在具名的人之间转移，不能被系统吸收、不能被 agent 承载。
      本类是 AccountabilityLink.responsible_person 的唯一合法目标类型——
      agent、模型组合均不可充当责任锚点（R-GOV-03 负面测锚点的类型学根据）。

  Intent:
    class_uri: dga:Intent
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^INT-[0-9]{4,}$"
    attributes:
      statement:
        range: string
        required: true
        description: 意图声明——闭环存在的原因（没有意图的闭环是僵尸流程，human v1.1 §2.1）。
      closure_type:
        range: string
        description: 闭环类型（客服/开发/资源调度等；类型清单属实例层）。
      desired_outcome:
        range: string
        description: 期望产物与判定标准（对齐"规格层"声明，human v1.1 §3.1）。
      holder:
        range: Person
        description: 意图持有者（具名的人）。
      source_ref:
        range: string
        description: 来源引用（权威源=飞书的需求草稿/业务讨论，DGA-INFRA 第 1 章权威源表）。
    description: >
      意图（六元组分量一；human v1.1 §5.3 映射：Intent → Object 闭环类型+挂接责任人的关系）。
      决策前提的最顶层声明。

  ContextAsset:
    class_uri: dga:ContextAsset
    mixins:
      - SecurityMark
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^CTX-[0-9]{4,}$"
    attributes:
      asset_type:
        range: KnowledgeForm
        description: 知识形态（规格/记忆/负结果/能力前沿，human v1.1 §3.2）。
      uri:
        range: string
        description: 资产定位（Git 路径/对象存储 URI 等）。
      version:
        range: SemVer
        description: 资产版本。
      expiry_condition:
        range: string
        description: >
          过期条件（负结果与判例的半衰期，human v1.1 §3.2/§4.4：当时模型版本、当时能力
          边界；条件变化触发重估）。
      authority_source:
        range: string
        description: 该资产的权威源（R-GOV-01 关键字段唯一权威源）。
    description: >
      上下文资产（六元组分量二；human v1.1 §5.3 映射：Context → Object 上下文资产+
      校准域实体）。行动的决策前提——有限理性公理的直接落点（§1.1 推论：控制决策
      前提即控制行为）。

  CapabilityEntity:
    class_uri: dga:CapabilityEntity
    mixins:
      - SecurityMark
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^CAP-[0-9]{4,}$"
    attributes:
      executor_type:
        range: ExecutorType
        description: 执行体类型（agent/工具/模型/流程引擎）。
      model_refs:
        range: string
        multivalued: true
        description: 依赖的模型清单（池组成相关；漂移监控对象）。
      endpoint_ref:
        range: string
        description: 接入的逻辑端点（LogicalEndpoint id，EPL-xxxx）。
      capability_version:
        range: SemVer
        description: 能力版本（换模型不换结构——角色槽填充物的版本记录）。
    description: >
      能力实体（六元组分量三；human v1.1 §5.3 映射：Capability → Object 能力实体）。
      执行的手段：agent、工具、模型、流程引擎的组合体。注意：能力实体可承载执行权，
      但不可承载责任（责任守恒律，human v1.1 §1.4 推论二）。

  EvidenceEntity:
    class_uri: dga:EvidenceEntity
    mixins:
      - SecurityMark
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^EVD-[0-9]{4,}$"
    attributes:
      evidence_type:
        range: EvidenceType
        required: true
        description: 证据契约类型（执行收据/验收判定/签发记录/校准资产/策略判定记录，R-EVID-01）。
      content_digest:
        range: Sha256Hex
        description: 内容摘要（R-EVID-03：对象版本+内容摘要+独立写入权限+对象锁定）。
      object_version:
        range: string
        description: 对象存储版本号。
      storage_uri:
        range: string
        description: 证据存储定位（权威源=证据存储，DGA-INFRA 第 1 章权威源表）。
      object_locked:
        range: boolean
        description: 是否对象锁定（WORM）。防篡改证明"记录未被改"，不证明"记录为真"（R-EVID-03）。
      trace_ref:
        range: string
        description: 关联 OTel trace。Trace ≠ Evidence（R-EVID-02）：遥测不构成证据，仅提供线索。
      judge_model:
        range: string
        description: 判定器模型（R-EVID-04：判定证据必须含判定器模型）。
      judge_version:
        range: SemVer
        description: 判定器版本（R-EVID-04）。
      calibration_domain_ref:
        range: string
        description: 校准域 ID（R-EVID-04/R-POOL-CALIB：判定溯源三要件之三）。
    description: >
      证据实体（六元组分量五；human v1.1 §5.3 映射：Evidence → Object 证据实体）。
      行动可被外部判定的记录——缺证据的闭环叫赌博（human v1.1 §2.1）。
      判定类证据必须可溯源：判定器模型+版本+校准域 ID（R-EVID-04）。

  CalibrationDomain:
    class_uri: dga:CalibrationDomain
    mixins:
      - SecurityMark
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^CAL-[0-9]{4,}$"
    attributes:
      model_set_snapshot:
        range: string
        required: true
        multivalued: true
        description: >
          覆盖的模型集合快照（池组成快照，DGA-INFRA 3.8 R-POOL-CALIB）。
          评估器建模的是池混合分布，不是单端点（PR-INF-02c）。
      spec_version:
        range: SemVer
        required: true
        description: 校准时依据的 Spec 版本。
      harness_version:
        range: SemVer
        required: true
        description: 校准时依据的 Harness 版本。
      observation_window_start:
        range: datetime
        description: 观察窗口起点。
      observation_window_end:
        range: datetime
        description: 观察窗口终点。
      ontology_commit:
        range: GitCommit
        required: true
        description: >
          本体 schema 的 Git commit（human v1.1 §5.7 第三触发线：本体漂移——
          对象语义是分布的最底层参数；本体变更 ⇒ 已校准判定的有效性存疑 ⇒ 触发重估）。
      validity_status:
        range: boolean
        description: 当前是否有效（池组成/spec/harness/本体任一变化即触发漂移重估工作流）。
    description: >
      校准域（DGA-INFRA 3.8 R-POOL-CALIB 与 R-EVID-04 的锚点类）。
      每份 eval 校准必须声明其校准域：覆盖的模型集合（池组成快照）+ Spec/Harness 版本
      + 观察窗口 + 本体版本引用。池组成变化 ⇒ 触发相关闭环的漂移重估工作流——
      不是禁止漂移，而是把漂移纳入治理。

  Budget:
    class_uri: dga:Budget
    attributes:
      currency:
        range: string
        description: 币种（如 CNY/USD/credit）。
      amount_cap:
        range: float
        description: 上限金额（闭环级预算上限，R-POOL-BUDGET）。
      period:
        range: string
        description: 计费周期口径（per-run/daily/monthly）。
    description: >
      预算结构体（R-POOL-BUDGET 成本熔断的声明载体）。全司级日/月熔断阈值
      属 S5 裁决项（S5-PENDING-DEFAULTS #5），本结构只承载闭环级与全局声明。

  Commitment:
    class_uri: dga:Commitment
    slots:
      - id
      - name
      - created_at
      - retired_at
    slot_usage:
      id:
        pattern: "^CMT-[0-9]{4,}$"
    attributes:
      promise:
        range: string
        required: true
        description: 承诺内容（对谁、承诺什么）。
      promisee:
        range: string
        description: 承诺相对方（客户/干系人）。
      accountable_person:
        range: Person
        required: true
        description: 承诺责任人（具名的人；社会关系的合法主体，human v1.1 §1.4）。
      linked_authorization:
        range: string
        description: 关联授权（Authorization id，AUT-xxxx）。
      state:
        range: ClosureState
        description: 承诺履约状态。
    description: >
      已接受承诺（权威源=控制面 DB，DGA-INFRA 第 1 章权威源表）。
      承诺→闭环→授权→执行→证据→判定→责任连接关系的起点（CMP-01 核心资产）。

  Authorization:
    class_uri: dga:Authorization
    mixins:
      - SecurityMark
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^AUT-[0-9]{4,}$"
    attributes:
      scope:
        range: string
        required: true
        multivalued: true
        description: 授权范围（允许的操作集合/资源边界；R-POL-02：子任务权限≤父任务）。
      budget:
        range: Budget
        inlined: true
        description: 预算上限（闭环级；R-POOL-BUDGET）。
      decision_timespan:
        range: DecisionTimespan
        description: 决断时距（human v1.1 §2.3：自治的最大无人复核时间跨度；超时挂起，R-POOL-DEGRADE）。
      autonomy_level:
        range: AutonomyLevel
        description: 授予的自治等级（L0-L5；跳级即事故）。
      granted_executor:
        range: string
        description: 被授权执行体（CapabilityEntity id，CAP-xxxx）——授权 agent 的是执行权。
      granted_by:
        range: Person
        required: true
        description: 授权人（具名的人）——授权人的是责任（human v1.1 §1.4 推论二：两份授权文书、两种治理）。
      valid_from:
        range: datetime
        description: 生效时间。
      valid_until:
        range: datetime
        description: 失效时间（自治边界到期即停；崩溃恢复后须重验当前授权，R-POL-02）。
    description: >
      有效授权（权威源=控制面 DB，DGA-INFRA 第 1 章权威源表）。
      结构：scope/budget/decision_timespan。恢复检查点须重验当前授权（R-POL-02）。

  DecisionOption:
    class_uri: dga:DecisionOption
    attributes:
      option_label:
        range: string
        required: true
        description: 选项名。
      tradeoff:
        range: string
        description: 该选项的代价与收益（供 S5 审阅的取舍说明）。
    description: S5 决策卡片的候选项（R-GOV-04 固定结构之"选项"）。

  S5DecisionCard:
    class_uri: dga:S5DecisionCard
    slots:
      - id
      - name
      - created_at
    slot_usage:
      id:
        pattern: "^DC-[0-9]{4,}$"
    attributes:
      decision_object:
        range: string
        required: true
        description: 决策对象（要裁决什么）。
      evidence_refs:
        range: string
        multivalued: true
        description: 支撑证据（EvidenceEntity id 列表，EVD-xxxx）。
      options:
        range: DecisionOption
        required: true
        multivalued: true
        inlined_as_list: true
        description: 候选项集合（R-GOV-04：固定结构之一）。
      recommendation:
        range: string
        required: true
        description: 推荐项及理由（推导链引用 DGA-INFRA/CORE 条目 ID，8.3 纪律）。
      deadline:
        range: datetime
        required: true
        description: 审阅期限（超期按 R-GOV-07 安全默认模式处理）。
      approval_consequences:
        range: string
        required: true
        description: 批准后果（批准后会发生什么/爆炸半径声明）。
      decided_by:
        range: Person
        description: 裁决人（S5；S5 不可代理——R-SEC-04 禁止代签）。
      decided_at:
        range: datetime
        description: 裁决时间。
    description: >
      S5 决策卡片（R-GOV-04 锚点类）：固定结构=对象/证据/选项/推荐/期限/批准后果，
      六字段全部 required。飞书审批卡是本类的受控投影（第 1 章：飞书仪表盘=
      权威信息的受控投影，非权威源）。

  Project:
    class_uri: dga:Project
    slots:
      - id
      - name
      - created_at
      - retired_at
    slot_usage:
      id:
        pattern: "^PRJ-[0-9]{4,}$"
    attributes:
      accountable_person:
        range: Person
        required: true
        description: 项目责任人（具名）。项目完成 ≠ 责任消失（R-GOV-05）。
      start_date:
        range: date
        required: true
        description: 开始日期。
      end_date:
        range: date
        required: true
        description: 结束日期（有限期变更的界定字段；届满须显式延期或关闭）。
      deliverable_spec:
        range: string
        description: 交付物规格引用。
      linked_service:
        range: string
        description: 交付后转入的持续服务（Service id，SVC-xxxx）。
    description: >
      项目（R-GOV-05 锚点类之一）：有限期变更的登记。项目与服务分离登记，
      项目完成不注销责任——accountable_person 在项目关闭后仍为历史证据链的责任锚点
      （R-IR-04：历史证据不足的项目标记"治理状态未知/待验证"）。

  Service:
    class_uri: dga:Service
    slots:
      - id
      - name
      - created_at
      - retired_at
    slot_usage:
      id:
        pattern: "^SVC-[0-9]{4,}$"
    attributes:
      accountable_person:
        range: Person
        required: true
        description: 服务责任人（具名；持续履约期间责任持续在位）。
      service_scope:
        range: string
        required: true
        description: 履约范围声明。
      sla_summary:
        range: string
        description: SLA 摘要（响应/恢复目标）。
      related_projects:
        range: string
        multivalued: true
        description: 关联项目（Project id 列表，PRJ-xxxx）。
    description: >
      服务（R-GOV-05 锚点类之二）：持续履约的登记。与 Project 分离登记——
      一次性交付与持续运营的责任结构不同，不得混用同一登记类型。
