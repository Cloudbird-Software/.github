<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>创建 verifier-app GitHub App</title>
</head>
<body onload="document.forms[0].submit()">
  <p>正在跳转到 GitHub 创建 <strong>verifier-app</strong> App……<br>
  （浏览器需已登录 Cloudbird-Software 组织 owner 账号；表单已按最小权限预填，确认后点 <em>Create GitHub App</em>。）</p>
  <form method="post" action="https://github.com/organizations/Cloudbird-Software/settings/apps/new">
    <input type="hidden" name="manifest" value='{
  "name": "verifier-app",
  "description": "ISSUE-263 / ADR-0080 验证者 APP：仅测试/验证路径写权，holdout 挂载，1h 短期令牌",
  "url": "https://github.com/Cloudbird-Software",
  "public": false,
  "default_permissions": {
    "contents": "write",
    "issues": "write",
    "pull_requests": "write",
    "metadata": "read"
  }
}'>
    <noscript><button type="submit">继续</button></noscript>
  </form>
</body>
</html>
